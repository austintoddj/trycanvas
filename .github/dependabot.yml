version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
        # Reason: typescript-eslint does not support TypeScript 7 yet.
        # https://github.com/typescript-eslint/typescript-eslint/issues/10940

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
